// AuthService — see docs/api/auth.md, which this file matches
// field-for-field. That doc is the source of truth for semantics;
// this file is its wire encoding.
syntax = "proto3";

package marginal.auth.v1;

option go_package = "marginal/auth-service/genproto/authv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service AuthService {
  rpc Register     (RegisterRequest)     returns (TokenPair);
  rpc Authenticate (AuthenticateRequest) returns (TokenPair);
  rpc GetUser       (GetUserRequest)      returns (User);
  rpc Refresh        (RefreshRequest)     returns (TokenPair);
  rpc Revoke          (RevokeRequest)     returns (google.protobuf.Empty);
  rpc RevokeAll       (RevokeAllRequest)  returns (google.protobuf.Empty);

  // § 18 ADMIN's PEOPLE panel and its SESSIONS readout.
  //
  // Unpaginated and unfiltered: a self-hosted instance's whole
  // point is that this list is short, and a cursor API nobody
  // can exercise is worse than none. It carries no
  // password_hash — a column that never leaves the repo cannot
  // leak from a screen.
  //
  // NOT authorization-gated, and that is a gap rather than a
  // design: RBAC is v3.1.0, and until it exists every
  // authenticated actor can call this. Stated here so the ADMIN
  // screen can state it too.
  rpc ListPeople      (ListPeopleRequest) returns (ListPeopleResponse);
}

message User {
  string id           = 1; // UUIDv7
  string email        = 2;
  string display_name = 3;
  string cursor_color = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListPeopleRequest {}

message ListPeopleResponse {
  repeated User users = 1;
  // Refresh tokens neither revoked nor expired — "signed in
  // somewhere", which is what the screen means by SESSIONS. It
  // is deliberately NOT a count of live WebSocket connections;
  // those are collaboration-service's and are a different
  // number.
  int64 active_sessions = 2;
}

message TokenPair {
  string access_token  = 1; // RS256 JWT
  string refresh_token = 2; // opaque, random — never a JWT
  int64 expires_in     = 3; // access token lifetime in seconds, from issuance
}

message RegisterRequest {
  string email        = 1;
  string password     = 2;
  string display_name = 3;
}
message AuthenticateRequest { string email = 1; string password = 2; }
message GetUserRequest      { string id = 1; }
message RefreshRequest      { string refresh_token = 1; }
message RevokeRequest {
  string refresh_token         = 1;
  optional string access_token = 2;
}
message RevokeAllRequest {}
