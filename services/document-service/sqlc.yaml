version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/pagerepo/queries.sql"
    schema: "internal/migrate/migrations"
    gen:
      go:
        package: "pagerepo"
        out: "internal/pagerepo/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "ltree"
            go_type: "string"
  - engine: "postgresql"
    queries: "internal/blockrepo/queries.sql"
    schema: "internal/migrate/migrations"
    gen:
      go:
        package: "blockrepo"
        out: "internal/blockrepo/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
