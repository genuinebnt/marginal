// PageService — the gRPC contract for page metadata (create/get/list/
// rename/reparent/delete). See docs/api/pages.md, which this file matches
// field-for-field — that doc is the source of truth for semantics; this
// file is its wire encoding.
//
// This is deliberately NOT where block content changes go — those are
// documentcore Ops (services/document-service/internal/documentcore),
// applied through a separate surface once one exists. PageService only
// owns the page row: title, tree position, lifecycle.
syntax = "proto3";

package marginal.document.v1;

option go_package = "marginal/document-service/genproto/documentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service PageService {
  rpc CreatePage   (CreatePageRequest)   returns (Page);
  rpc GetPage      (GetPageRequest)      returns (Page);
  rpc ListPages    (ListPagesRequest)    returns (ListPagesResponse);
  rpc RenamePage   (RenamePageRequest)   returns (Page);
  rpc ReparentPage (ReparentPageRequest) returns (Page);
  rpc DeletePage   (DeletePageRequest)   returns (google.protobuf.Empty);
  // ListBacklinks reads docs.page_links (internal/blockproj's projection
  // of collab.ops_flushed, not a page property PageService itself owns) —
  // it lives on this service purely because that table is in this
  // service's own database, not because it's page metadata like the rest
  // of this RPC set.
  rpc ListBacklinks(ListBacklinksRequest) returns (ListBacklinksResponse);
  // ListBlocks reads docs.blocks (blockproj's own projection) — same
  // reasoning as ListBacklinks: this is diagnostics-service's read path
  // onto a page's actual prose (v2.3.0), not page metadata. kind_json/
  // content_json are documentcore.BlockKind/Content's own JSON shapes,
  // passed through verbatim rather than re-modelled as proto messages —
  // the caller already imports marginal/documentcore and can unmarshal
  // them directly, and this table's payload columns are already JSONB.
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);

  // v2.6.0 — the delete saga, made observable and reversible.
  rpc PreviewDelete(PreviewDeleteRequest) returns (PreviewDeleteResponse);
  rpc ListTrash    (ListTrashRequest)     returns (ListTrashResponse);
  rpc RestorePage  (RestorePageRequest)   returns (Page);

  // v2.7.0 — classification.
  rpc ListTopics    (ListTopicsRequest)    returns (ListTopicsResponse);
  rpc SetPageTopic  (SetPageTopicRequest)  returns (Page);
  rpc AddPageTag    (AddPageTagRequest)    returns (Page);
  rpc RemovePageTag (RemovePageTagRequest) returns (Page);
  rpc ListTagFacets (ListTagFacetsRequest) returns (ListTagFacetsResponse);

  // v2.8.0 — resume. Where the caret was, per user per page.
  rpc SaveReadingPosition (SaveReadingPositionRequest) returns (google.protobuf.Empty);
  rpc ListReadingPositions(ListReadingPositionsRequest) returns (ListReadingPositionsResponse);
}

enum LifecycleState {
  LIFECYCLE_STATE_UNSPECIFIED = 0;
  LIFECYCLE_STATE_ACTIVE      = 1;
  LIFECYCLE_STATE_DELETING    = 2;
  LIFECYCLE_STATE_DELETED     = 3;
}

message Page {
  string id                     = 1; // UUIDv7
  string created_by             = 2;
  string title                  = 3;
  optional string parent_id     = 4;
  string path                   = 5; // materialised LTREE ancestry
  string sort_key               = 6; // opaque, lexicographic
  LifecycleState lifecycle_state = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10;
  // v2.7.0. One owned topic (absent = untopiced, a real state the UI
  // reports rather than a gap), and any number of free-form tags.
  optional Topic topic          = 11;
  repeated string tags          = 12;
  // v2.8.0. How much document the page holds, over the docs.blocks
  // projection. Carried on Page because a reading estimate is drawn wherever
  // a page title is — the rail, the dashboard, the reader, search — and four
  // client-side word counts over four differently-shaped payloads is four
  // numbers that disagree. Both are 0 when the projection has no rows for
  // the page yet, which an empty page and a lagging projection share.
  int32 block_count             = 13;
  int32 word_count              = 14;
}

// A topic is singular per page and carries a colour KEY, never a hex value
// — the palette lives in the design system (DESIGN_GUIDELINES.md §3.4).
message Topic {
  string id        = 1;
  string name      = 2;
  string color_key = 3;  // protocol|storage|interface|operations|research
  int32  page_count = 4; // live pages only; 0 unless returned by ListTopics
}

message CreatePageRequest {
  string title = 1;
  optional string parent_id = 2;
  optional string after = 3;
}

message GetPageRequest { string id = 1; }

message ListPagesRequest {
  optional string parent_id = 1;
  optional string after = 2;
  optional int32 limit = 3;
}

message ListPagesResponse {
  repeated Page pages = 1;
  optional string next_cursor = 2;
}

message RenamePageRequest {
  string id = 1;
  string title = 2;
}

message ReparentPageRequest {
  string id = 1;
  optional string parent_id = 2;
  optional string after = 3;
}

message DeletePageRequest { string id = 1; }

message ListBacklinksRequest { string page_id = 1; }

message ListBacklinksResponse { repeated Backlink backlinks = 1; }

message Backlink {
  string from_page = 1;
  string from_page_title = 2;
  bool from_page_deleted = 3; // linking page's own lifecycle — a backlink from a since-deleted page is still worth showing as such
  string target_title = 4;    // the literal text written, e.g. "Backlink Target" — may differ in case from this page's own title
}

message ListBlocksRequest { string page_id = 1; }

message ListBlocksResponse { repeated Block blocks = 1; }

message Block {
  string id = 1;
  optional string parent_id = 2;
  string kind_json = 3;    // documentcore.BlockKind's own tagged-object JSON
  string content_json = 4; // documentcore.Content's own JSON ({text, marks})
}


// ---------------------------------------------------------------- v2.6.0

message PreviewDeleteRequest  { string id = 1; }
message PreviewDeleteResponse {
  repeated Page descendants = 1;  // the LTREE subtree this delete cascades to
  repeated Page referrers   = 2;  // pages whose [[links]] would dangle
  int32         block_count = 3;
}

message ListTrashRequest  { int32 limit = 1; int32 offset = 2; }
message ListTrashResponse  {
  repeated TrashEntry entries = 1;
  int32               total   = 2;
}
message TrashEntry {
  Page                      page     = 1;
  google.protobuf.Timestamp purge_at = 2;  // derived: deleted_at + window
  // Present only while the saga runs. A finished saga has no progress to
  // report, so absence here is how a caller tells 'deleting' from 'deleted'
  // without re-reading lifecycle_state.
  optional SagaProgress     progress = 3;
}
message SagaProgress {
  repeated string steps_done = 1;  // in completion order
  repeated string steps_left = 2;
  int32           attempts   = 3;  // > 1 means it resumed after a crash
  optional string last_error = 4;
  // Steps with no backing store at this repo's scope (embeddings, blobs).
  // Sent so the UI can render them as "no store yet" rather than as work
  // performed or silently drop them.
  repeated string not_applicable = 5;
}

message RestorePageRequest { string id = 1; }

// ---------------------------------------------------------------- v2.7.0

message ListTopicsRequest  {}
message ListTopicsResponse { repeated Topic topics = 1; int32 untopiced_pages = 2; }

// topic_id absent clears the assignment back to untopiced.
message SetPageTopicRequest  { string page_id = 1; optional string topic_id = 2; }
message AddPageTagRequest    { string page_id = 1; string tag = 2; }
message RemovePageTagRequest { string page_id = 1; string tag = 2; }

message ListTagFacetsRequest  { int32 limit = 1; }
message ListTagFacetsResponse { repeated TagFacet facets = 1; }
message TagFacet {
  string tag            = 1;
  int32  page_count     = 2;
  // Distinct topics the tag's pages span. ui-mockups § 10b: "a tag that
  // lives in three topics is doing real work — it names a technique, not a
  // subject."
  int32  topics_spanned = 3;
}


// ---------------------------------------------------------------- v2.8.0

message SaveReadingPositionRequest {
  string page_id = 1;
  // Absent means "this page, but no particular block" — a page opened and
  // scrolled but never clicked into. Still worth resuming to.
  optional string block_id = 2;
  int32  caret_start = 3;
  int32  caret_end   = 4;
}

message ListReadingPositionsRequest { int32 limit = 1; }
message ListReadingPositionsResponse { repeated ReadingPosition positions = 1; }

message ReadingPosition {
  string page_id     = 1;
  string page_title  = 2;
  optional string block_id = 3;
  int32  caret_start = 4;
  int32  caret_end   = 5;
  google.protobuf.Timestamp updated_at = 6;
  // The page's topic, so the resume card can draw its chip without a second
  // round trip per card.
  optional Topic topic = 7;
}
