// GraphService — the gRPC contract for the real [[link]] graph
// (docs/ui-mockups/v2/index.html § 07 GRAPH, graph-algorithms.html). See
// docs/api/graph.md, which this file matches field-for-field.
//
// Read-only and parameter-light on purpose: every algorithm here
// (graphalgo) is a pure function over docs.pages/docs.page_links
// as of right now, computed fresh per request — there is no persisted
// "graph" state of its own to keep consistent, unlike PageService's own
// rows.
syntax = "proto3";

package marginal.document.v1;

option go_package = "marginal/document-service/genproto/documentv1";

service GraphService {
  // GetLinkGraph is every live page (a node, even with zero links) and
  // every resolved [[link]] (an edge) — raw data for the client to
  // render (force layout, drawing), never itself an algorithm result.
  rpc GetLinkGraph(GetLinkGraphRequest) returns (LinkGraph);

  // AnalyzeGraph runs every parameter-free algorithm once, over the whole
  // graph: connected components, orphan detection, cycle detection, and
  // diameter (graphalgo).
  rpc AnalyzeGraph(AnalyzeGraphRequest) returns (GraphAnalysis);

  // GraphNeighborhood is the one parameterized view: BFS shortest-path
  // distances (undirected — "link distance" doesn't care which way a
  // link points), forward reachability ("blast radius," directed —
  // outbound links only), and the ranked nearest ring, from one chosen
  // source page.
  rpc GraphNeighborhood(GraphNeighborhoodRequest) returns (GraphNeighborhoodResponse);
}

message GetLinkGraphRequest {}

message LinkGraph {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message GraphNode {
  string id = 1;
  string title = 2;
  // is_root mirrors graphalgo.Orphans' own root set: a page
  // with no parent, reachable without already knowing another page's
  // title exists.
  bool is_root = 3;
  // v2.9.0 — the page's declared topic, "" when untopiced.
  //
  // Carried HERE rather than joined by the client from ListPages, which is
  // the bug this field exists to fix: ListPages returns direct children of
  // one parent, so a client joining it against this node set coloured only
  // the ROOT pages and silently drew every nested page as untopiced. The
  // graph endpoint already reads docs.pages.topic_id — it is the partition
  // modularity is scored against — so the data was already loaded and only
  // the wire shape was missing.
  string topic_name = 4;
  string topic_color_key = 5;
  // The page's free-form tags, for the same reason: the tag filter joined
  // ListPages too, and was therefore filtering over the root pages only.
  repeated string tags = 6;
}

message GraphEdge {
  string from_page = 1;
  string to_page = 2;
}

message AnalyzeGraphRequest {}

message GraphAnalysis {
  // component_of maps every page id to its connected-component id
  // (graphalgo.Components, over the undirected projection).
  map<string, int32> component_of = 1;
  // orphan_components are component ids containing none of the root
  // pages — graph-algorithms.html's own "a mutually-linked pair with
  // nothing pointing in is still orphaned" argument.
  repeated int32 orphan_components = 2;
  // cycle is one example cycle, as an ordered, closed list of page ids
  // (first == last) — empty if the graph is acyclic.
  repeated string cycle = 3;
  int32 diameter = 4;
  // betti is graph-algorithms.html's own topology panel
  // (graphalgo.Betti) — see BettiNumbers' own field comments for
  // why some of these are graph facts and some are a stated modelling
  // choice (filling every triangle).
  BettiNumbers betti = 5;

  // betweenness is each page's Brandes centrality over the UNDIRECTED view
  // (graphalgo.Betweenness), normalised to [0,1]. A page can have few links
  // and high betweenness — that is the interesting case, because it is a
  // bridge whose degree never warned you.
  map<string, double> betweenness = 6;

  // modularity_by_topic is Newman's Q for the partition pages DECLARE
  // (docs.pages.topic_id). Compared against a partition the graph itself
  // implies, the gap is the finding: topics scoring much lower would mean
  // they describe something other than how pages link.
  double modularity_by_topic = 7;

  // modularity_by_component is Q for the connected components — the
  // emergent partition, and the honest baseline to read the above against.
  double modularity_by_component = 8;

  // strongly_connected maps every page to its strongly connected component
  // (graphalgo.StronglyConnected, Tarjan, over the DIRECTED graph).
  //
  // A different question from component_of, which is why both are here:
  // component_of asks "can I walk between these two pages ignoring
  // direction"; this asks "can I walk there AND back following links as
  // written". A component of size > 1 is a citation loop.
  map<string, int32> strongly_connected = 9;
  // scc_sizes are those components' sizes, largest first. All ones means no
  // citation loops anywhere — the healthy default, worth being able to state.
  repeated int32 scc_sizes = 10;

  // topological_order is a reading order in which no page comes before one it
  // links to (graphalgo.TopologicalSort, Kahn, ties broken on page id so the
  // order is stable across requests).
  //
  // PARTIAL when is_dag is false: it holds every page that could be placed
  // before the algorithm ran out of prerequisite-free nodes, and `unplaced`
  // holds the rest. That partial result is the useful half of a failure.
  repeated string topological_order = 11;
  bool is_dag = 12;
  repeated string unplaced = 13;
  // layers groups topological_order into dependency LEVELS — everything in
  // one level can be read in any order, or by two people at once. The number
  // of layers is the longest dependency chain in the workspace.
  repeated GraphLayer layers = 14;
}

// GraphLayer exists only because proto3 has no repeated-of-repeated.
message GraphLayer { repeated string page_ids = 1; }

message BettiNumbers {
  int32 b0 = 1;         // components
  int32 b1 = 2;         // cycle rank of the plain graph: E - V + b0
  int32 b1_clique = 3;  // b1 minus rank(boundary map ∂2) — the loops surviving after every triangle is filled
  int32 b2 = 4;         // chi - b0 + b1_clique, read off the Euler characteristic for free
  int32 chi = 5;        // Euler characteristic of the clique complex: V - E + F
  int32 triangles = 6;  // |F| — how many 3-cliques were filled
  int32 rank2 = 7;      // rank(∂2) over GF(2) — exactly the loops triangles killed
}

message GraphNeighborhoodRequest { string source_page_id = 1; }

message GraphNeighborhoodResponse {
  // undirected_distance: link-distance BFS from source_page_id — the
  // page-by-page "wavefront" a client animates one distance value at a
  // time. Absent from the map means unreachable.
  map<string, int32> undirected_distance = 1;
  // forward_reachable: directed BFS from source_page_id, outbound links
  // only — the blast radius a cascading delete starting there would take
  // with it.
  map<string, int32> forward_reachable = 2;

  // nearest is the ranked ring around source_page_id — nearest first by hop
  // distance, ties broken on page id (graphalgo.NearestNeighbours).
  //
  // Near BY LINKS, deliberately not near by meaning: /discover answers that
  // one with cosine distance over embeddings, and the gap between the two
  // answers is the finding — a page about the same thing you have never cited
  // is near by meaning and far by links.
  repeated GraphNeighbour nearest = 3;
  // ring_sizes[d] is how many pages sit exactly d hops away, starting at
  // d = 0 (the source itself). The shape is the argument: a frontier that
  // stops growing is a graph that stops connecting.
  repeated int32 ring_sizes = 4;

  // reading_path is "what to read before this page, and in what order" —
  // everything that reaches it by following links FORWARD, layered so that a
  // page with no prerequisites of its own comes first, ending at the page
  // itself (graphalgo.ReadingPath).
  //
  // Deliberately NOT the shortest path, which answers "how are these two
  // connected" and already has its own field, and deliberately not "pages
  // with similar tags", because shared tags give you neighbours rather than
  // prerequisites — only the arrows carry order.
  //
  // A page nothing links to has a path of ONE step: itself. That is what
  // "start here" looks like, and it is a real answer rather than an empty one.
  repeated PathStep reading_path = 5;
}

message GraphNeighbour {
  string page_id = 1;
  string title = 2;
  int32 hops = 3;
}

// PathStep is one page on the way to another — graphalgo.ReadingPath.
message PathStep {
  string page_id = 1;
  string title   = 2;
  // The dependency LAYER, not the distance from the target: two pages at the
  // same depth can be read in either order.
  int32  depth   = 3;
  // Always true for exactly the last step. The list is what to read UP TO the
  // page you asked about, so ending anywhere else would leave the reader
  // wondering where they were going.
  bool   destination = 4;
}
